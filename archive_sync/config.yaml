name: Archive Sync Worker
version: "0.5.4"
slug: archive_sync
description: Resumable file synchronization worker for a mounted storage share
url: https://github.com/traglodit22/dashboard-nas-sync
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
webui: http://[HOST]:[PORT:8099]
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: file API (read/write under destination_root, Bearer token)
map:
  - homeassistant_config:rw
  - share:rw
options:
  service_url: ""
  token_file: /homeassistant/.archive-sync-token
  worker_id: home-assistant-nas
  category: gallery
  batch_size: 100
  parallel_downloads: 4
  cloud_sync_enabled: false
  cloud_parallel_downloads: 2
  destination_root: /share/NAS
  retry_delay_seconds: 30
  auto_start: false
  backup_enabled: true
  backup_destination_root: /share/NAS/backups
  backup_project_name: dashboard
  backup_projects_json: "[]"
  files_enabled: false
  files_root: /share/NAS
  tunnel_enabled: false
  tunnel_host: ""
  tunnel_port: 22
  tunnel_user: nas-tunnel
  tunnel_remote_bind: 127.0.0.1:18125
  tunnel_private_key: ""
  tunnel_key_file: ""
schema:
  service_url: str
  token_file: str
  worker_id: match(^[a-zA-Z0-9._-]{1,80}$)
  category: match(^gallery$|^cloud$)
  batch_size: int(1,500)
  parallel_downloads: int(1,16)
  cloud_sync_enabled: bool
  cloud_parallel_downloads: int(1,16)
  destination_root: str
  retry_delay_seconds: int(5,3600)
  auto_start: bool
  backup_enabled: bool
  backup_destination_root: str
  backup_project_name: match(^[a-z0-9][a-z0-9_-]{0,63}$)
  backup_projects_json: str
  files_enabled: bool
  files_root: str
  tunnel_enabled: bool
  tunnel_host: str?
  tunnel_port: int(1,65535)
  tunnel_user: match(^[a-zA-Z0-9._-]{1,32}$)
  tunnel_remote_bind: str
  tunnel_private_key: str?
  tunnel_key_file: str?
