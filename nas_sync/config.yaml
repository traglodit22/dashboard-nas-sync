name: Dashboard NAS Sync
version: "0.1.0"
slug: dashboard_nas_sync
description: Resumable logical-name synchronization between Dashboard and a Home Assistant NAS mount
url: https://github.com/traglodit22/dashboard-nas-sync
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
webui: http://[HOST]:[PORT:8099]
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: NAS Sync status and controls
map:
  - homeassistant_config:rw
  - share:rw
options:
  dashboard_url: https://plansolo.ru
  token_file: /homeassistant/nas-sync-token
  agent_id: home-assistant-nas
  category: gallery
  batch_size: 100
  destination_root: /share/NAS
  retry_delay_seconds: 30
  auto_start: false
schema:
  dashboard_url: url
  token_file: str
  agent_id: match(^[a-zA-Z0-9._-]{1,80}$)
  category: match(^gallery$|^cloud$)
  batch_size: int(1,500)
  destination_root: str
  retry_delay_seconds: int(5,3600)
  auto_start: bool
